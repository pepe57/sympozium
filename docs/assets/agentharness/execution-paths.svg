<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Choose between a persistent HarnessSession and an ephemeral AgentRun</title>
  <desc id="desc">An Agent configured with an approved runtime can open a persistent interactive chat through a HarnessSession or execute a bounded auditable task through an AgentRun.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#e8562a"/></marker>
    <style>.bg{fill:#111110}.panel{fill:#1a1a18;stroke:#484841;stroke-width:2}.agent{fill:#352019;stroke:#e8562a;stroke-width:2}.chat{fill:#15221e;stroke:#3dd68c;stroke-width:2}.run{fill:#151d24;stroke:#4c9cff;stroke-width:2}.line{stroke:#e8562a;stroke-width:3;fill:none;marker-end:url(#arrow)}.h1{fill:#f0ece4;font:700 30px Inter,Arial,sans-serif}.h2{fill:#f0ece4;font:700 20px Inter,Arial,sans-serif}.t{fill:#c9c5bb;font:15px Inter,Arial,sans-serif}.small{fill:#8a8c82;font:13px Inter,Arial,sans-serif}.tag{fill:#e8562a;font:700 12px Inter,Arial,sans-serif;letter-spacing:1.2px}.green{fill:#3dd68c}.blue{fill:#4c9cff}</style>
  </defs>
  <rect class="bg" width="1200" height="520" rx="18"/>
  <text x="50" y="58" class="h1">One Agent, two explicit execution paths</text><text x="50" y="86" class="t">Use chat for a continuing conversation. Use an AgentRun for bounded work and automation.</text>
  <rect class="agent" x="55" y="155" width="285" height="220" rx="14"/><text x="82" y="194" class="tag">AGENT</text><text x="82" y="235" class="h2">Approved runtime selected</text><text x="82" y="267" class="small">runtimeRef · model allowlist</text><text x="82" y="292" class="small">policy · skills · identity</text><text x="82" y="337" class="small">The runtime choice is inherited</text><text x="82" y="358" class="small">by both paths.</text>
  <path class="line" d="M340 220H445"/><path class="line" d="M340 310H445"/><text x="370" y="207" class="small">Chat</text><text x="370" y="297" class="small">Task</text>
  <rect class="chat" x="455" y="125" width="315" height="155" rx="14"/><text x="480" y="158" class="tag green">INTERACTIVE</text><text x="480" y="194" class="h2">HarnessSession</text><text x="480" y="224" class="small">private persistent workload · resumable</text><text x="480" y="248" class="small">adapter owns live context · idle timeout</text>
  <rect class="run" x="455" y="300" width="315" height="155" rx="14"/><text x="480" y="333" class="tag blue">BOUNDED</text><text x="480" y="369" class="h2">AgentRun</text><text x="480" y="399" class="small">isolated ephemeral Job · scheduled or manual</text><text x="480" y="423" class="small">terminal result · provenance · workload exits</text>
  <rect class="panel" x="830" y="155" width="310" height="220" rx="14"/><text x="857" y="194" class="tag">SYMPOZIUM BOUNDARY</text><text x="857" y="235" class="h2">Platform-controlled</text><text x="857" y="270" class="small">admission · credential scoping</text><text x="857" y="296" class="small">private networking · lifecycle</text><text x="857" y="322" class="small">accounting status · provenance</text><path class="line" d="M770 202H817"/><path class="line" d="M770 378C805 378 805 332 817 332"/>
  <text x="50" y="490" class="small">A HarnessSession is not a long-running AgentRun; the resources have different lifecycle and persistence semantics.</text>
</svg>
